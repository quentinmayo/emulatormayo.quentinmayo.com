plugins { id 'com.android.application' }
android {
    namespace 'com.emulatormayo.app'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig {
        testInstrumentationRunner 'com.emulatormayo.app.ControllerMenuSmoke'
        applicationId 'com.emulatormayo.app'; minSdk 29; targetSdk 36; versionCode 5; versionName '0.2.1' }
    signingConfigs {
        if (System.getenv('EMULATORMAYO_KEYSTORE')) {
            release {
                storeFile file(System.getenv('EMULATORMAYO_KEYSTORE'))
                storePassword System.getenv('EMULATORMAYO_STORE_PASSWORD')
                keyAlias System.getenv('EMULATORMAYO_KEY_ALIAS')
                keyPassword System.getenv('EMULATORMAYO_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; if (System.getenv('EMULATORMAYO_KEYSTORE')) signingConfig signingConfigs.release } }
    sourceSets.main.assets.srcDirs = ['../player', '../../desktop/runtime']
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress += ['data', 'wasm'] }
}
dependencies { implementation 'androidx.webkit:webkit:1.14.0'; implementation 'androidx.activity:activity:1.11.0' }

name: Android APK
on:
  pull_request:
    branches: [main]
    paths: ['android/**', 'modules/boogie-woogie/**', '.gitmodules', 'desktop/scripts/prepare-runtime.py', '.github/workflows/android.yml']
  push:
    branches: [main]
    tags: ['android-v*']
    paths: ['android/**', 'modules/boogie-woogie/**', '.gitmodules', 'desktop/scripts/prepare-runtime.py', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install py7zr==1.1.3
      - run: python desktop/scripts/prepare-runtime.py
      - run: python modules/boogie-woogie/scripts/prepare-runtime.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test native gameplay controller
        run: |
          bash android/tests/test-state.sh
          node --test android/tests/gamepad.test.cjs
      - name: Validate native Android app
        working-directory: android
        run: ./gradlew assembleDebug assembleDebugAndroidTest lintDebug
      - name: Restore private release signing key
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          KEY_BASE64: ${{ secrets.EMULATORMAYO_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          key = Path(os.environ['RUNNER_TEMP']) / 'emulatormayo-release.p12'
          key.write_bytes(base64.b64decode(os.environ['KEY_BASE64'], validate=True))
          key.chmod(0o600)
          PY
      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/android-v')
        working-directory: android
        env:
          EMULATORMAYO_KEYSTORE: ${{ runner.temp }}/emulatormayo-release.p12
          EMULATORMAYO_STORE_PASSWORD: ${{ secrets.EMULATORMAYO_STORE_PASSWORD }}
          EMULATORMAYO_KEY_ALIAS: ${{ secrets.EMULATORMAYO_KEY_ALIAS }}
          EMULATORMAYO_KEY_PASSWORD: ${{ secrets.EMULATORMAYO_KEY_PASSWORD }}
        run: ./gradlew assembleRelease lintRelease
      - name: Prepare release asset
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk "Emulatormayo-${GITHUB_REF_NAME#android-v}-android.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: startsWith(github.ref, 'refs/tags/android-v')
        with:
          name: android
          path: Emulatormayo-*-android.apk
          if-no-files-found: error
      - if: always()
        run: rm -f "$RUNNER_TEMP/emulatormayo-release.p12"
  publish:
    needs: android
    if: startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: android
          path: artifacts
      - name: Publish signed Android alpha and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          sha256sum *.apk > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" \
            --title "Emulatormayo $GITHUB_REF_NAME · Native Android Alpha" --prerelease \
            --notes-file ../android/release-notes.md
